<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Destination Card with HTML &amp; CSS ✈️ | Modern Travel UI</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<article class="destination-card">
  <div class="destination-image">
    <img
      src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=85"
      alt="Beautiful mountain lake destination"
    >

    <div class="image-overlay"></div>

    <span class="destination-tag">TOP DESTINATION</span>

    <button class="favorite-button" type="button" aria-label="Save destination">
      ♡
    </button>

    <div class="destination-location">
      <span>⌖</span>
      <span>Queenstown, New Zealand</span>
    </div>
  </div>

  <div class="destination-content">
    <div class="destination-heading">
      <div>
        <p class="destination-type">ADVENTURE ESCAPE</p>
        <h1>Explore the Wild</h1>
      </div>

      <div class="rating">
        <span>★</span>
        <strong>4.9</strong>
      </div>
    </div>

    <p class="destination-description">
      Discover breathtaking landscapes, crystal-clear lakes, and unforgettable
      mountain adventures.
    </p>

    <div class="destination-details">
      <span>☀ 18°C</span>
      <span>◷ 5 days</span>
      <span>♧ Nature</span>
    </div>

    <div class="destination-footer">
      <div class="trip-price">
        <small>TRIPS FROM</small>
        <strong>$849</strong>
        <span>/ person</span>
      </div>

      <button class="explore-button" type="button">
        Explore <span>→</span>
      </button>
    </div>
  </div>
</article>
</body>
</html>
